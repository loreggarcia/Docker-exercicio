services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [echo-net]
  api:
    build: ./api
    expose: ["5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [echo-net]
networks:
  echo-net:
    driver: bridge
