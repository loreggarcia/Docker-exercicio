services:
  frontend:
    build: ../../../examples/01-basic-compose/frontend
    ports: ["8090:80"]
    depends_on:
      api:
        condition: service_healthy
  api:
    build: ../../../examples/01-basic-compose/api
    command: ["sh", "-c", "sleep 12; exec gunicorn --bind 0.0.0.0:5000 --access-logfile - app:app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 15s
